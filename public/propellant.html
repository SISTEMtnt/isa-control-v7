<script>
(function(){
  // 0% at T-30:00 -> 100% at T-3:00 (linear)
  const START=30*60*1000, END=3*60*1000
  const q=new URLSearchParams(location.search).get('scale'); if(q) document.querySelector('.panel').style.setProperty('--s',q)
  const clamp=v=>Math.max(0,Math.min(1,v))
  function progress(r){ if(r==null||r>=START) return 0; if(r<=END) return 1; return (START-r)/(START-END) }
  function fill(id,top,bot,p){const e=document.getElementById(id),h=(bot-top)*p;e.setAttribute('y',bot-h);e.setAttribute('height',h)}
  function draw(L){
    // L = {a:ship CH4, b:ship LOX, c:booster CH4, d:booster LOX} each 0..1
    for(const k in L) document.getElementById(k).innerHTML=(L[k]*100).toFixed(1)+'<sup>%</sup>'
    fill('fSC',83,135.3,L.a); fill('fSL',128,188,L.b)
    fill('fBC',199,290,L.c);  fill('fBL',290,422,L.d)
  }
  function levels(p){ return {a:Math.pow(p,0.97),b:p,c:Math.pow(p,1.03),d:Math.pow(p,1.06)} }
  let state=null, skew=0, skewReady=false
  const elapsed=t=>t.running? t.elapsedMs+(Date.now()-skew-t.startTimestamp) : t.elapsedMs
  function render(){
    let remain=null
    if(state&&state.timer.mode==='down') remain=state.timer.totalMs-elapsed(state.timer)
    draw(levels(clamp(progress(remain))))
  }
  draw(levels(0))
  requestAnimationFrame(function tick(){render();requestAnimationFrame(tick)})
  function connect(){
    const ws=new WebSocket((location.protocol==='https:'?'wss:':'ws:')+'//'+location.host+'/')
    ws.onmessage=e=>{try{const m=JSON.parse(e.data);if(m.type==='state'){state=m;if(m.serverNow){const sm=Date.now()-m.serverNow;if(!skewReady){skew=sm;skewReady=true}else if(sm<skew)skew=sm}}}catch{}}
    ws.onclose=()=>setTimeout(connect,1200)
    ws.onerror=()=>ws.close()
  }
  connect()
})()
</script></body></html>
