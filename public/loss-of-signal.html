<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loss of Signal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --fg: #f3f6fb;
    --dim: rgba(243,246,251,0.55);
    --dim2: rgba(243,246,251,0.32);
    --red: #ff4141;
    --amber: #ffc93c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: #060a12;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    color: var(--fg);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  .grain {
    position: fixed;
    inset: 0;
    background:
      repeating-linear-gradient(0deg, rgba(255,255,255,0.025) 0px, rgba(255,255,255,0.025) 1px, transparent 1px, transparent 3px),
      radial-gradient(ellipse at 50% 45%, rgba(60,80,110,0.22), transparent 65%);
    mix-blend-mode: screen;
    pointer-events: none;
  }
  .vignette {
    position: fixed;
    inset: 0;
    box-shadow: inset 0 0 220px rgba(0,0,0,0.75);
    pointer-events: none;
  }

  .wrap {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .card { text-align: center; }

  .status {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.28em;
    color: var(--red);
    text-transform: uppercase;
    margin-bottom: 22px;
  }
  .status .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--red);
    box-shadow: 0 0 12px var(--red);
    animation: blink 1.1s ease-in-out infinite;
  }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }

  .title {
    font-size: 88px;
    font-weight: 800;
    letter-spacing: 0.06em;
    line-height: 1;
    text-transform: uppercase;
    text-shadow: 0 0 40px rgba(255,255,255,0.14);
  }

  .subtitle {
    margin-top: 18px;
    font-size: 17px;
    font-weight: 600;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--dim);
  }

  .rule {
    width: 460px;
    max-width: 70vw;
    height: 1px;
    margin: 36px auto;
    background: linear-gradient(90deg, transparent, rgba(243,246,251,0.28), transparent);
  }

  .clock {
    font-family: 'JetBrains Mono', monospace;
    font-size: 64px;
    font-weight: 700;
    letter-spacing: 0.05em;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 0 24px rgba(255,255,255,0.12);
  }
  .clock.hold { color: var(--amber); }
  .clock.abort { color: var(--red); animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.55} }

  .mission {
    margin-top: 14px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--dim2);
  }

  .since {
    margin-top: 12px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--dim2);
  }
</style>
</head>
<body>
<div class="grain"></div>
<div class="vignette"></div>

<div class="wrap">
  <div class="card">
    <div class="status"><span class="dot"></span><span>No Signal</span></div>
    <div class="title">Loss of Signal</div>
    <div class="subtitle">Standing by for reacquisition</div>
    <div class="rule"></div>
    <div class="clock" id="clock">T+00:00:00</div>
    <div class="mission" id="mission">STARSHIP FLIGHT TEST</div>
    <div class="since" id="since">Signal lost 0 seconds ago</div>
  </div>
</div>

<script>
(function () {
  function pad(n) { return String(n).padStart(2, '0') }
  function fmt(ms) {
    const s = Math.floor(Math.abs(ms) / 1000)
    return pad(Math.floor(s / 3600)) + ':' + pad(Math.floor((s % 3600) / 60)) + ':' + pad(s % 60)
  }

  let state = null, skew = 0, skewReady = false

  function elapsed(t) {
    if (!t.running) return t.elapsedMs
    return t.elapsedMs + (Date.now() - skew - t.startTimestamp)
  }

  function render() {
    if (!state) return
    const t = state.timer
    const e = elapsed(t)
    let text
    let remainMs = null
    if (t.mode === 'down') remainMs = t.totalMs - e

    if (t.aborted) {
      text = 'T-ABORT'
    } else if (t.hold) {
      text = 'T-HOLD'
    } else if (t.mode === 'down') {
      text = remainMs > 0 ? 'T-' + fmt(remainMs) : 'T+' + fmt(e - t.totalMs)
    } else {
      text = 'T+' + fmt(e)
    }

    const clock = document.getElementById('clock')
    clock.textContent = text
    clock.className = 'clock' + (t.aborted ? ' abort' : t.hold ? ' hold' : '')

    document.getElementById('mission').textContent = t.label || 'STARSHIP FLIGHT TEST'
  }

  requestAnimationFrame(function tick() { render(); requestAnimationFrame(tick) })

  // "Signal lost X seconds ago" — counts from whenever this OBS scene last
  // became visible (page load, or tab/scene becoming active again), since
  // there's no external "signal" telemetry — the operator switches to this
  // scene at the moment signal is actually lost.
  let losStart = Date.now()
  function tickSince() {
    const secs = Math.max(0, Math.floor((Date.now() - losStart) / 1000))
    document.getElementById('since').textContent =
      'Signal lost ' + secs + (secs === 1 ? ' second ago' : ' seconds ago')
    setTimeout(tickSince, 1000)
  }
  tickSince()
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') losStart = Date.now()
  })

  function connect() {
    const p = location.protocol === 'https:' ? 'wss:' : 'ws:'
    const ws = new WebSocket(p + '//' + location.host + '/')
    ws.onmessage = e => {
      try {
        const m = JSON.parse(e.data)
        if (m.type === 'state') {
          state = m
          if (m.serverNow) {
            // sync once, then only accept lower (lower-latency) samples
            const sm = Date.now() - m.serverNow
            if (!skewReady) { skew = sm; skewReady = true }
            else if (sm < skew) skew = sm
          }
        }
      } catch {}
    }
    ws.onclose = () => setTimeout(connect, 1200)
    ws.onerror = () => ws.close()
  }
  connect()
})()
</script>
</body>
</html>
